<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,9..144,700&family=JetBrains+Mono:wght@700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<script src="rec/meta.js"></script><script>window.REC_S = window.REC</script><script src="rec_j/meta.js"></script><script>window.REC_J = window.REC</script>
<script src="tempos4.js"></script>
<style>
  :root { --pink:#FF5FA2; --butter:#FFD84D; --sky:#5BC8F5; --mint:#7EE0B5; --cream:#FFF8EC; --ink:#2A1B3D }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#FFD84D; font-family:'Outfit',sans-serif; color:var(--ink) }
  #stage { position:absolute; inset:0; overflow:hidden }
  .sc { position:absolute; inset:0; display:none }
  .abs { position:absolute }
  .conf { position:absolute }
  .frame { position:absolute; z-index:2; overflow:hidden; border-radius:60px 60px 0 0; border:12px solid #FFF8EC; border-bottom:0; background:#fff; box-shadow:0 -10px 50px rgba(42,27,61,.18) }
  .frame img { position:absolute; left:0; top:0; width:100%; object-fit:cover; object-position:top; display:block }
  .cap { position:absolute; left:40px; width:1000px; text-align:center; font:800 90px/1.06 'Outfit'; letter-spacing:-.035em; color:var(--ink); will-change:transform,opacity,filter }
  .cap.behind { z-index:1 } .cap.top { z-index:4 } .cap.mid { z-index:4 }
  .cap .w { display:inline-block; will-change:transform,opacity }
  .mk { position:relative; display:inline-block; padding:0 .2em; margin:0 .02em; font-family:'Fraunces',serif; font-style:italic; font-weight:700; letter-spacing:-.01em; color:var(--mkc,#fff); font-size:1.12em }
  .mk .bg { position:absolute; inset:.08em 0 .02em; background:var(--mk,var(--pink)); border-radius:.22em; transform-origin:left center; z-index:-1 }
  .mk .tx { position:relative }
  .gc { position:absolute; z-index:5; display:flex; align-items:center; gap:16px; padding:20px 28px; border-radius:30px; font:800 31px/1.15 'Outfit'; color:var(--ink);
    background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.5)); backdrop-filter:blur(16px) saturate(1.4); border:1.5px solid rgba(255,255,255,.95);
    box-shadow:0 18px 44px rgba(42,27,61,.18), 0 0 0 1px color-mix(in srgb,var(--ac,#FF5FA2) 38%,transparent), 0 0 34px color-mix(in srgb,var(--ac,#FF5FA2) 26%,transparent), inset 0 1px 0 #fff }
  .gc i { font-style:normal; font-size:44px }
  .btn { position:absolute; z-index:5; display:flex; align-items:center; justify-content:center; gap:22px; height:156px; border-radius:90px; font:800 54px 'Outfit'; color:#fff; background:#22C55E; box-shadow:0 22px 50px rgba(20,120,60,.35); white-space:nowrap }
  .wa { position:absolute; z-index:2; border-radius:56px 56px 0 0; overflow:hidden; background:#efeae2; border:12px solid #FFF8EC; border-bottom:0; box-shadow:0 -10px 50px rgba(42,27,61,.18) }
  .wa .hd { height:118px; background:#008069; color:#fff; display:flex; align-items:center; gap:22px; padding:0 30px; font-weight:800; font-size:36px }
  .wa .av { width:70px; height:70px; border-radius:50%; background:linear-gradient(135deg,#f9a8d4,#fcd34d); display:grid; place-items:center; font-size:38px }
  .msg { position:absolute; left:20px; right:20px; top:22px; color:#111; background:#d9fdd3; border-radius:30px 30px 30px 8px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.14) }
  .msg .pv { border-radius:22px; overflow:hidden; background:#c5ecc0 } .msg .pv img { width:100%; display:block }
  .msg .pv .tx { padding:12px 18px 14px } .msg .tt { font-weight:800; font-size:29px } .msg .ds { font-size:23px; color:rgba(17,17,17,.65); margin-top:3px }
  .msg .tx2 { padding:12px 12px 4px; font-size:28px; line-height:1.28 } .msg .tm { text-align:right; font-size:22px; color:rgba(17,17,17,.45); padding:0 8px 4px }
  .nm { display:inline-block; font-weight:800; color:#0b6b4f }
</style></head><body><div id="stage"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const E = { out: k => 1 - Math.pow(1 - k, 3), io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2) } }
const P = (t, t0, d) => clamp((t - t0) / d)
const $ = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const EVENTS = new Map(), ev = (t, type) => EVENTS.set(type + '@' + t.toFixed(3), { t: +t.toFixed(3), type })
const C = { pink:'#FF5FA2', butter:'#FFD84D', sky:'#5BC8F5', mint:'#7EE0B5', cream:'#FFF8EC', ink:'#2A1B3D' }
const WA = '<svg width="80" height="80" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>'
const LINES = Object.fromEntries(TL.linhas.map(l => [l.id, l]))
const TOTAL = +(TL.dur + .55).toFixed(3)
const norm = s => s.toLowerCase().normalize('NFD').replace(/[^\w]/g, '')
// tempo (global) da palavra w dentro da linha id (n-ésima ocorrência)
function W(id, w, n = 0) { let k = 0; for (const c of LINES[id].chunks) for (const x of c.words) if (norm(x.w) === norm(w) && k++ === n) return x.t; throw new Error('palavra ' + w + ' em ' + id) }
const confeti = list => list.map(([x, y, kind, c, r]) => kind === 'r' ? `<div class="conf" data-r="${r}" style="left:${x}px;top:${y}px;width:62px;height:25px;border-radius:12px;background:${C[c]};transform:rotate(${r}deg)"></div>` : `<div class="conf" data-r="${r}" style="left:${x}px;top:${y}px;width:66px;height:66px;background:${C[c]};clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transform:rotate(${r}deg)"></div>`).join('')
const drift = (el, t) => el.querySelectorAll(':scope > .conf').forEach((c, i) => { c.style.transform = `translate(${Math.sin(t * 1.3 + i) * 14}px,${Math.cos(t * 1.1 + i * 2) * 18}px) rotate(${+c.dataset.r + Math.sin(t * 2 + i) * 14}deg)` })

/* ---------- legenda estratégica: um trecho por vez, palavra por palavra, alternando posição ---------- */
function capEl(chunk) { const parts = []; let buf = null
  for (const w of chunk.words) { if (w.kw) { if (!buf) { buf = []; parts.push({ kw: true, ws: buf }) } buf.push(w) } else { buf = null; parts.push({ kw: false, ws: [w] }) } }
  const html = parts.map(p => p.kw ? `<span class="w mk" data-t="${p.ws[0].t}"><i class="bg"></i><span class="tx">${p.ws.map(w => w.w).join(' ')}</span></span>` : `<span class="w" data-t="${p.ws[0].t}">${p.ws[0].w}</span>`).join(' ')
  const el = $(`<div class="cap ${chunk.pos}">${html}</div>`); el._c = chunk; return el }
function capAnim(el, t, tEnd) { const c = el._c, t0 = c.t - .14, out = P(t, tEnd - .16, .16)
  const vis = t >= t0 - .02 && t < tEnd + .01; el.style.display = vis ? 'block' : 'none'; if (!vis) return
  const k = c.pos === 'behind' ? E.back(P(t, t0, .5)) : E.out(P(t, t0, .38))
  const y = c.pos === 'behind' ? (1 - k) * 230 : (1 - k) * -36
  el.style.transform = `translateY(${y - out * 26}px) scale(${1 - out * .04})`; el.style.opacity = (c.pos === 'behind' ? 1 : clamp(P(t, t0, .2))) * (1 - out); el.style.filter = `blur(${out * 10 + (c.pos === 'behind' ? 0 : (1 - clamp(P(t, t0, .25))) * 8)}px)`
  el.querySelectorAll('.w').forEach(w => { const tw = +w.dataset.t - .1, kw = E.out(P(t, tw, .22)); w.style.opacity = kw; w.style.transform = `translateY(${(1 - kw) * 18}px)`
    if (w.classList.contains('mk')) { const kb = E.back(P(t, tw, .4)); w.querySelector('.bg').style.transform = `scaleX(${clamp(kb, 0, 1.06)}) rotate(-1.6deg)`; w.style.transform += ` scale(${.9 + .1 * kb})` } }) }
const CAPY = { top: 'top:236px', behind: 'bottom:1182px', mid: 'top:470px' }
function addCaps(el, ids, sc) { const caps = []; let mi = 0
  for (const id of ids) for (const c of LINES[id].chunks) { if (c.pos === 'btn' || c.pos === 'bio') continue; const e = capEl(c); e.style.cssText += ';' + (c.pos === 'mid' ? `top:${400 + 140 * mi++}px` : CAPY[c.pos]); el.appendChild(e); caps.push(e) }
  return caps }
function capsAnim(caps, t, sceneEnd, keepAll) { caps.forEach((e, i) => { const nx = caps[i + 1]; const tEnd = keepAll ? sceneEnd + 1 : (nx ? nx._c.t - .14 : sceneEnd); capAnim(e, t, tEnd) }) }

function gcAnim(el, t, t0, side, y, tOut = 1e9) { const k = E.back(P(t, t0, .45)), o = P(t, tOut, .25); el.style.opacity = clamp(P(t, t0, .12)) * (1 - o); el.style.top = (y + Math.sin(t * 2 + y) * 6) + 'px'
  el.style[side < 0 ? 'left' : 'right'] = '28px'; el.style.transform = `translateX(${((1 - k) + o) * 150 * side}px) scale(${.6 + .4 * k})`; el.style.transformOrigin = side < 0 ? 'left center' : 'right center' }
const riseY = (t, t0) => (1 - E.out(P(t, t0, .55))) * 1250
const VIDS = []
function vidPanel(top = 760) { const p = $(`<div class="frame" style="left:130px;top:${top}px;width:820px;height:${1920 - top + 20}px"><img class="v" style="height:1774px"></div>`); VIDS.push(p.querySelector('.v')); return p }
function vset(p, rec, dir, tr) { const i = clamp(Math.round(tr * 30), 0, rec.frames.length - 1); const im = p.querySelector('.v'), s = dir + '/' + rec.frames[i]; if (im.getAttribute('src') !== s) im.src = s }
const imgPanel = (src, top = 760, off = 0) => $(`<div class="frame" style="left:130px;top:${top}px;width:820px;height:${1920 - top + 20}px"><img src="img/${src}" style="height:1780px;top:${off}px"></div>`)

const scenes = []
function add(key, bg, ids, build, update) { const el = $('<div class="sc"></div>'); el.style.background = bg; if (bg === C.pink) { el.style.setProperty('--mk', C.butter); el.style.setProperty('--mkc', C.ink) }
  stage.appendChild(el); const first = LINES[ids[0]], last = LINES[ids[ids.length - 1]]
  const a = scenes.length ? first.t - .3 : 0; const ctx = build(el); ctx.caps = addCaps(el, ids, ctx); scenes.push({ key, el, ctx, update, a, ids }) }
function finish() { scenes.forEach((s, i) => { s.b = i + 1 < scenes.length ? scenes[i + 1].a : TOTAL }) }

/* A · história + personalizado no tema (gravação real: Jardim e depois Safari) */
add('A', C.butter, ['l1', 'l2'], el => { el.innerHTML = confeti([[900, 120, 's', 'pink', 8], [60, 1700, 'r', 'sky', -20]])
  const p = vidPanel(); const c1 = $('<div class="gc" style="--ac:#FF5FA2"><i>📸</i><span>As fotinhas<br>do seu bebê</span></div>')
  const t1 = $('<div class="gc" style="--ac:#7EE0B5"><i>🦋</i><span>Jardim<br>encantado</span></div>'), t2 = $('<div class="gc" style="--ac:#FFD84D"><i>🦁</i><span>Safari</span></div>'), t3 = $('<div class="gc" style="--ac:#5BC8F5"><i>🎨</i><span>Do jeitinho<br>da sua festa</span></div>')
  el.append(p, c1, t1, t2, t3); return { p, c1, t1, t2, t3 } },
  (c, t, s) => { const g = t + s.a, tf = W('l2', 'personalizado') - .05
    c.p.style.transform = `translateY(${riseY(t, .05)}px) rotateY(${g > tf && g < tf + .5 ? Math.sin(P(g, tf, .5) * Math.PI) * 90 : 0}deg)`
    if (g < tf + .25) vset(c.p, REC_J, 'rec_j', 6.9 + t * .95); else vset(c.p, REC_S, 'rec', 7.0 + (g - tf - .25) * 1.0)
    gcAnim(c.c1, g, W('l1', 'fotinhas'), -1, 1060, tf); gcAnim(c.t1, g, W('l1', 'história'), 1, 1300, tf); gcAnim(c.t2, g, tf + .3, 1, 1060); gcAnim(c.t3, g, W('l2', 'tema'), -1, 1330)
    ev(.03, 'whoosh'); ev(.2, 'swipe'); ev(W('l1', 'fotinhas') - s.a, 'pop'); ev(W('l1', 'história') - s.a, 'pop'); ev(tf - s.a, 'swipe'); ev(tf + .3 - s.a, 'pop'); ev(W('l2', 'tema') - s.a, 'pop') })

/* B · WhatsApp com o nome de cada convidado */
add('B', C.sky, ['l3', 'l4'], el => { el.innerHTML = confeti([[900, 120, 's', 'butter', 8], [60, 1700, 'r', 'pink', -20]])
  const LN = ['<span class="hi">Oi, <span class="nm">Marcela</span>! 🦋</span>', 'O jardim está em flor! A Lara vai comemorar o aniversário e queremos muito você com a gente nesse dia encantado.', '📅 sábado, 17 de abril · ⏰ 10h', '📍 Espaço Jardim das Borboletas', '🎩 Cores leves, flores e muita alegria!', 'Confirme por aqui, leva menos de um minuto:', '<span style="color:#1a73e8;text-decoration:underline">festa-da-lara.web.app/c/<span class="nm2">marcela</span></span>', 'Com carinho, Marina e Bruno 💗']
  const wa = $(`<div class="wa" style="left:90px;top:760px;width:900px;height:1180px"><div class="hd"><div class="av">🦋</div><div><span class="hn">Tia Marcela</span><div style="font-size:23px;font-weight:500;color:rgba(255,255,255,.8)">online</div></div></div><div style="position:relative;height:1060px"><div class="msg"><div class="pv"><img src="img/og-jardim.jpg"><div class="tx"><div class="tt">Convite da Lara 🦋🌸🐝</div><div class="ds">Toque para ver o convite e confirmar sua presença.</div></div></div><div class="tx2">${LN.map(l => `<div class="ln" style="margin-bottom:6px">${l}</div>`).join('')}<div class="tm">14:02 ✓✓</div></div></div></div></div>`)
  const c1 = $('<div class="gc" style="--ac:#FFD84D"><i>💌</i><span>Com o nome<br>de cada um</span></div>'), c2 = $('<div class="gc" style="--ac:#7EE0B5"><i>👆</i><span>Mensagem pronta<br>em 1 toque</span></div>')
  el.append(wa, c1, c2); return { wa, c1, c2, lns: [...wa.querySelectorAll('.ln')], nm: wa.querySelector('.nm'), nm2: wa.querySelector('.nm2'), hn: wa.querySelector('.hn') } },
  (c, t, s) => { const g = t + s.a; c.wa.style.transform = `translateY(${riseY(t, .05)}px)`
    c.lns.forEach((e, i) => { const k = E.out(P(t, .55 + i * .11, .3)); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 12}px)` })
    const N = [['Marcela', 'Tia Marcela', 'marcela'], ['Beto', 'Tio Beto', 'beto'], ['Lúcia', 'Vovó Lúcia', 'lucia'], ['Carol', 'Dinda Carol', 'carol'], ['Pedro', 'Pedro (primo)', 'pedro'], ['Marcela', 'Tia Marcela', 'marcela']]
    const tn = W('l3', 'nome'), idx = g < tn ? 0 : Math.min(N.length - 1, Math.floor((g - tn) / .36) + 1); const ch = g >= tn ? P((g - tn) % .36, 0, .12) : 1
    c.nm.textContent = N[idx][0]; c.hn.textContent = N[idx][1]; c.nm2.textContent = N[idx][2]; c.nm.style.transform = `scale(${1 + .25 * (1 - ch)})`; c.nm.style.background = g >= tn && idx < N.length - 1 ? 'rgba(255,216,77,.55)' : 'transparent'
    gcAnim(c.c1, g, tn + .05, -1, 1450); gcAnim(c.c2, g, W('l4', 'único') - .1, 1, 1700)
    ev(.03, 'whoosh'); ev(.2, 'swipe'); ev(.5, 'chime'); for (let i = 1; i < N.length; i++) ev(tn - s.a + (i - 1) * .36, 'tick'); ev(tn - s.a + .05, 'pop'); ev(W('l4', 'único') - .1 - s.a, 'pop') })

/* C · só digitar o nome (gravação real) */
add('C', C.pink, ['l5'], el => { el.innerHTML = confeti([[900, 120, 'r', 'butter', 24], [60, 1700, 's', 'sky', -6]])
  const p = vidPanel(); const c1 = $('<div class="gc" style="--ac:#FFD84D"><i>⌨️</i><span>Só o nome,<br>mais nada</span></div>'), c2 = $('<div class="gc" style="--ac:#7EE0B5"><i>👨‍👩‍👧</i><span>Responde pela<br>família toda</span></div>')
  el.append(p, c1, c2); return { p, c1, c2 } },
  (c, t, s) => { const g = t + s.a; c.p.style.transform = `translateY(${riseY(t, .05)}px)`; const d = LINES.l5.end - s.a + .3; vset(c.p, REC_J, 'rec_j', 1.0 + clamp((t - .3) / (d - .3)) * 4.4)
    gcAnim(c.c1, g, W('l5', 'digitar'), -1, 1080, W('l5', 'vovó') - .3); gcAnim(c.c2, g, W('l5', 'vovó') - .2, 1, 1320)
    ev(.03, 'whoosh'); ev(.2, 'swipe'); for (let i = 0; i < 9; i++) ev(.55 + i * .11, 'key'); ev(W('l5', 'digitar') - s.a, 'pop'); ev(W('l5', 'vovó') - .2 - s.a, 'pop') })

/* D · descobre antes da festa quem vai e quem não vai */
add('D', C.butter, ['l6'], el => { el.innerHTML = confeti([[900, 120, 's', 'pink', 8], [60, 1700, 'r', 'pink', -20]])
  const p = imgPanel('a-1-visao.jpg'); const c1 = $('<div class="gc" style="--ac:#7EE0B5"><i>✅</i><span><b class="n1">0</b> vão</span></div>'), c2 = $('<div class="gc" style="--ac:#FF5FA2"><i>🙅‍♀️</i><span><b class="n2">0</b> não vão</span></div>'), c3 = $('<div class="gc" style="--ac:#5BC8F5"><i>📅</i><span>Bem antes<br>da festa</span></div>')
  el.append(p, c1, c2, c3); return { p, c1, c2, c3 } },
  (c, t, s) => { const g = t + s.a; c.p.style.transform = `translateY(${riseY(t, .05)}px)`; const tv = W('l6', 'vai'), tn = W('l6', 'não')
    gcAnim(c.c3, g, W('l6', 'antes') + .1, 1, 1000); gcAnim(c.c1, g, tv - .05, -1, 1200); gcAnim(c.c2, g, tn - .05, 1, 1420)
    c.c1.querySelector('.n1').textContent = Math.round(48 * E.out(P(g, tv, .7))); c.c2.querySelector('.n2').textContent = Math.round(9 * E.out(P(g, tn, .5)))
    ev(.03, 'whoosh'); ev(.2, 'swipe'); ev(W('l6', 'antes') + .1 - s.a, 'pop'); ev(tv - .05 - s.a, 'pop'); ev(tn - .05 - s.a, 'pop'); for (let i = 0; i < 6; i++) ev(tv - s.a + i * .1, 'tick') })

/* E · adultos, crianças, vagas do papai e da mamãe */
add('E', C.sky, ['l7'], el => { el.innerHTML = confeti([[900, 120, 'r', 'butter', 24], [60, 1700, 's', 'pink', -6]])
  const p = imgPanel('a-2-visao2-edit.jpg', 760, -170); const c1 = $('<div class="gc" style="--ac:#FFD84D"><i>👩‍🍼</i><span>Vagas do papai<br>e da mamãe</span></div>'), c2 = $('<div class="gc" style="--ac:#FF5FA2"><i>🎟️</i><span>Gratuidades<br>por idade</span></div>'), c3 = $('<div class="gc" style="--ac:#7EE0B5"><i>🧒</i><span>Adultos e<br>crianças</span></div>')
  el.append(p, c1, c2, c3); return { p, c1, c2, c3 } },
  (c, t, s) => { const g = t + s.a; c.p.style.transform = `translateY(${riseY(t, .05)}px)`
    gcAnim(c.c3, g, W('l7', 'crianças'), -1, 1520); gcAnim(c.c1, g, W('l7', 'papai'), 1, 1040); gcAnim(c.c2, g, W('l7', 'contadinho'), -1, 1290)
    ev(.03, 'whoosh'); ev(.2, 'swipe'); ev(W('l7', 'crianças') - s.a, 'pop'); ev(W('l7', 'papai') - s.a, 'pop'); ev(W('l7', 'contadinho') - s.a, 'pop') })

/* F · a tia que esqueceu: lembrete em 1 toque */
add('F', C.butter, ['l8'], el => { el.innerHTML = confeti([[900, 120, 's', 'sky', 8], [60, 1700, 'r', 'pink', -20]])
  const p = imgPanel('a-4b-lembrar.jpg'); const c1 = $('<div class="gc" style="--ac:#FF5FA2"><i>⏰</i><span>Lembrete<br>em 1 toque</span></div>'), c2 = $('<div class="gc" style="--ac:#7EE0B5"><i>💬</i><span>Enviado pra<br>Tia Bia ✓✓</span></div>')
  el.append(p, c1, c2); return { p, c1, c2 } },
  (c, t, s) => { const g = t + s.a; c.p.style.transform = `translateY(${riseY(t, .05)}px)`
    gcAnim(c.c1, g, W('l8', 'toque'), -1, 1100); gcAnim(c.c2, g, W('l8', 'chega') + .05, 1, 1360)
    ev(.03, 'whoosh'); ev(.2, 'swipe'); ev(W('l8', 'toque') - s.a, 'pop'); ev(W('l8', 'chega') + .05 - s.a, 'chime') })
