<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,9..144,700&family=JetBrains+Mono:wght@700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --pink:#FF5FA2; --butter:#FFD84D; --sky:#5BC8F5; --mint:#7EE0B5; --cream:#FFF8EC; --ink:#2A1B3D; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { background:var(--cream); color:var(--ink); font-family:'Outfit',sans-serif; overflow:hidden }
  body.board { width:1600px; height:1000px; position:relative }
  .abs { position:absolute }
  .disp { font-family:'Bagel Fat One',sans-serif }
  .acc { font-family:'Fraunces',serif; font-style:italic; font-weight:700 }
  .hand { font-family:'Caveat',cursive; font-weight:600 }
  .mono { font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.12em; text-transform:uppercase }
  .h1 { font-family:'Bagel Fat One'; font-size:74px; line-height:1; color:var(--pink); text-shadow:4px 4px 0 var(--butter), 8px 8px 0 var(--sky) }
  .pg { position:absolute; left:60px; top:44px } .pg .mono { font-size:16px; opacity:.6 }
  .foot { position:absolute; left:60px; right:60px; bottom:30px; display:flex; justify-content:space-between; font:700 15px 'JetBrains Mono'; letter-spacing:.12em; text-transform:uppercase; opacity:.5 }
  .card { position:absolute; background:#fff; border-radius:28px; box-shadow:0 10px 30px rgba(42,27,61,.10); padding:26px }
  .note { font-size:21px; line-height:1.35; font-weight:500 }
  .note b { font-weight:800 }
  .sw { position:absolute; width:236px; height:300px; border-radius:28px; padding:20px; display:flex; flex-direction:column; justify-content:flex-end; box-shadow:0 10px 26px rgba(42,27,61,.14) }
  .sw .n { font:800 30px 'Outfit' } .sw .m { font:700 15px 'JetBrains Mono'; letter-spacing:.06em; opacity:.9; line-height:1.5 }
  .btn { display:inline-flex; align-items:center; gap:12px; height:68px; padding:0 30px; border-radius:40px; font:800 26px 'Outfit'; color:#fff; background:#22C55E; box-shadow:0 12px 26px rgba(34,197,94,.38); white-space:nowrap }
  .pill { display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 22px; border-radius:30px; font:800 22px 'Outfit'; white-space:nowrap }
  .gc { position:absolute; display:flex; align-items:center; gap:14px; padding:16px 22px; border-radius:26px; font:800 22px/1.15 'Outfit'; color:var(--ink);
    background:linear-gradient(140deg,rgba(255,255,255,.82),rgba(255,255,255,.34)); backdrop-filter:blur(16px) saturate(1.4); border:1.5px solid rgba(255,255,255,.95);
    box-shadow:0 16px 40px rgba(42,27,61,.14), 0 0 0 1px color-mix(in srgb,var(--ac,#FF5FA2) 38%,transparent), 0 0 30px color-mix(in srgb,var(--ac,#FF5FA2) 26%,transparent), inset 0 1px 0 #fff }
  .gc i { font-style:normal; font-size:30px }
  .mark { position:relative; display:inline-block; padding:0 .22em; margin:0 -.05em }
  .mark::before { content:''; position:absolute; inset:.06em 0 .02em; background:var(--pink); border-radius:.22em; transform:rotate(-1.6deg); z-index:-1 }
  .conf { position:absolute; pointer-events:none }
  .frame { position:absolute; overflow:hidden; box-shadow:0 22px 44px rgba(42,27,61,.22) }
  .frame img { width:100%; height:100%; object-fit:cover; object-position:top; display:block }
  .sel { position:absolute; border-radius:50%; display:grid; place-items:center }
  .tag { font:700 14px 'JetBrains Mono'; letter-spacing:.1em; text-transform:uppercase; opacity:.65 }
  .ok { color:#14804A } .no { color:#D63B52 }
  /* peças em formato de post/story (body.piece) */
  body.piece { position:relative }
  .t-hook { font-family:'Outfit'; font-weight:800; letter-spacing:-.035em; line-height:1 }
  .markb::before { background:#FFD84D !important }
  .bub { position:absolute; padding:24px 34px; border-radius:40px 40px 40px 10px; background:#FFF8EC; font:800 44px/1.1 'Outfit'; color:#2A1B3D; box-shadow:0 16px 36px rgba(42,27,61,.16); white-space:nowrap }
  .row2 { position:absolute; left:70px; width:940px; display:flex; align-items:center; gap:26px; padding:28px 34px; border-radius:34px; background:#FFF8EC; box-shadow:0 14px 34px rgba(42,27,61,.12); font:800 40px/1.15 'Outfit'; color:#2A1B3D }
  .row2 i { font-style:normal; font-size:56px } .row2 em { margin-left:auto; font-style:normal; width:62px; height:62px; border-radius:50%; display:grid; place-items:center; font-size:34px; flex:none }
  .quote { font-family:'Fraunces',serif; font-style:italic; font-weight:700; letter-spacing:-.01em; color:#2A1B3D }
  .wam { position:absolute; border-radius:44px 44px 0 0; overflow:hidden; background:#efeae2; border:11px solid #FFF8EC; border-bottom:0 }
  .wam .hd { height:104px; background:#008069; color:#fff; display:flex; align-items:center; gap:18px; padding:0 26px; font:800 32px Outfit }
  .wam .av { width:62px; height:62px; border-radius:50%; background:linear-gradient(135deg,#f9a8d4,#fcd34d); display:grid; place-items:center; font-size:34px }
  .wam .ms { margin:20px; background:#d9fdd3; border-radius:28px 28px 28px 8px; padding:12px; box-shadow:0 8px 22px rgba(0,0,0,.12); color:#111 }
  .wam .ms img { width:100%; display:block; border-radius:20px } .wam .ms .t { padding:12px 10px 4px; font:500 27px/1.3 Outfit }
</style></head><body>
<div id="root"></div>
<script>
const qs = new URLSearchParams(location.search), PAGE = qs.get('p') || 'capa'
const C = { pink:'#FF5FA2', butter:'#FFD84D', sky:'#5BC8F5', mint:'#7EE0B5', cream:'#FFF8EC', ink:'#2A1B3D' }
const WA = '<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>'
// confete: pecinhas (retângulo, bolinha, estrela, ziguezague) em posições fixas
function confetti(list, scale = 1) {
  return list.map(([x, y, kind, col, r, s = 1]) => {
    const k = scale * s, c = C[col] || col
    if (kind === 'r') return `<div class="conf" style="left:${x}px;top:${y}px;width:${40*k}px;height:${16*k}px;border-radius:${8*k}px;background:${c};transform:rotate(${r}deg)"></div>`
    if (kind === 'd') return `<div class="conf" style="left:${x}px;top:${y}px;width:${22*k}px;height:${22*k}px;border-radius:50%;background:${c}"></div>`
    if (kind === 's') return `<div class="conf" style="left:${x}px;top:${y}px;width:${44*k}px;height:${44*k}px;background:${c};clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transform:rotate(${r}deg)"></div>`
    return `<svg class="conf" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)" width="${56*k}" height="${24*k}" viewBox="0 0 56 24"><path d="M4 14 q8 -14 16 0 t16 0 t16 0" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`
  }).join('')
}
const CF1 = [[90,120,'r','butter',-24],[300,70,'d','sky',0],[1380,110,'r','mint',32],[1490,260,'s','butter',10],[110,760,'s','sky',-8],[250,880,'r','pink',18],[1420,820,'d','pink',0],[1250,900,'r','sky',-30],[760,60,'z','mint',-14],[1100,60,'d','butter',0]]
const LOGO = (n, w, extra = '') => `<img src="logos/confete-${n}.svg" style="width:${w}px;${extra}">`
const pageHead = (n, t) => `<div class="pg"><div class="mono">${n} · ${t}</div></div><div class="foot"><span>Confete · Manual de marca</span><span>v1 · rascunho para aprovação</span></div>`
const pages = {}
/* ============================ 01 CAPA ============================ */
pages.capa = () => `
  <div class="abs" style="inset:0;background:linear-gradient(180deg,#FFF8EC,#FFEFD8)"></div>${confetti(CF1, 1.3)}
  <div class="abs" style="left:0;width:1600px;top:230px;text-align:center">${LOGO('principal', 1060, 'margin:0 auto')}</div>
  <div class="abs acc" style="left:0;width:1600px;text-align:center;top:620px;font-size:52px;color:var(--pink)">referência em convites personalizados infantis</div>
  <div class="abs mono" style="left:0;width:1600px;text-align:center;top:740px;font-size:20px;opacity:.7">Manual de marca · versão 1 · rascunho para aprovação</div>
  <div class="abs hand" style="left:0;width:1600px;text-align:center;top:800px;font-size:40px">confetedigital.com.br · @meuconfetedigital</div>`
/* ============================ 02 LOGO ============================ */
pages.logo = () => `${pageHead('02', 'Logo e versões')}
  <div class="abs h1" style="left:60px;top:88px">O logo</div>
  <div class="card" style="left:60px;top:200px;width:700px;height:360px;background:var(--cream);border:3px dashed rgba(42,27,61,.12);display:grid;place-items:center">${LOGO('principal', 600)}</div>
  <div class="abs note" style="left:60px;top:584px;width:700px"><b>Versão principal.</b> Letras bolhudas em rosa com sombra em degraus (manteiga e céu) e confete ao redor. Use sempre que houver espaço e fundo claro (creme ou branco).</div>
  <div class="card" style="left:800px;top:200px;width:360px;height:170px;background:var(--pink);display:grid;place-items:center;padding:10px">${LOGO('creme', 320)}</div>
  <div class="card" style="left:1180px;top:200px;width:360px;height:170px;background:var(--butter);display:grid;place-items:center;padding:10px">${LOGO('mono-tinta', 320)}</div>
  <div class="card" style="left:800px;top:390px;width:360px;height:170px;background:var(--ink);display:grid;place-items:center;padding:10px">${LOGO('mono-branco', 320)}</div>
  <div class="card" style="left:1180px;top:390px;width:360px;height:170px;background:var(--sky);display:grid;place-items:center;padding:10px">${LOGO('mono-tinta', 320)}</div>
  <div class="abs note" style="left:800px;top:584px;width:740px"><b>Sobre cor ou foto:</b> versão creme sobre rosa, ou monocromática (tinta ou branca) sobre manteiga, céu, menta, escuro ou fotos. Nunca a principal sobre fundo colorido: ela perde o contraste.</div>
  <div class="abs mono" style="left:60px;top:690px;font-size:16px;opacity:.6">Ícone (avatar do perfil, favicon, capa de destaque)</div>
  <div class="abs" style="left:60px;top:726px;display:flex;gap:28px">
    ${['principal', 'butter', 'tinta'].map(v => `<div style="width:190px;height:190px;border-radius:50%;overflow:hidden;box-shadow:0 10px 26px rgba(42,27,61,.16)"><img src="logos/confete-icone-${v}.svg" style="width:100%;height:100%"></div>`).join('')}
    <div class="note" style="width:620px;align-self:center;margin-left:12px"><b>Só o "c".</b> O Instagram corta em círculo: a letra fica no centro, com folga. Preferência: o ícone <b>rosa</b> como foto do perfil.</div></div>`
/* ============================ 03 USO ============================ */
pages.uso = () => `${pageHead('03', 'Espaço, tamanho e erros')}
  <div class="abs h1" style="left:60px;top:88px">Como usar</div>
  <div class="abs mono" style="left:60px;top:200px;font-size:16px;opacity:.6">Espaço de respiro</div>
  <div class="card" style="left:60px;top:236px;width:640px;height:330px;display:grid;place-items:center;background:#fff">
    <div style="position:relative;padding:50px;border:3px dashed var(--sky)">${LOGO('principal', 440)}
      <div class="mono abs" style="left:6px;top:6px;font-size:12px;color:var(--sky)">x</div><div class="mono abs" style="right:6px;bottom:6px;font-size:12px;color:var(--sky)">x</div></div></div>
  <div class="abs note" style="left:60px;top:582px;width:640px;font-size:19px"><b>x = altura do "o"</b> do logo. Mantenha esse espaço livre em volta, sem texto, foto ou borda de peça encostando.</div>
  <div class="abs mono" style="left:760px;top:200px;font-size:16px;opacity:.6">Tamanho mínimo</div>
  <div class="card" style="left:760px;top:236px;width:780px;height:150px;display:flex;align-items:center;gap:50px">
    <div style="text-align:center">${LOGO('principal', 200)}<div class="tag">200 px · digital</div></div>
    <div style="text-align:center">${LOGO('principal', 130)}<div class="tag">130 px · mínimo</div></div>
    <div style="text-align:center"><div style="width:48px;height:48px;border-radius:50%;overflow:hidden;margin:0 auto"><img src="logos/confete-icone-principal.svg" style="width:100%"></div><div class="tag">ícone 48 px</div></div></div>
  <div class="abs note" style="left:760px;top:408px;width:780px">Abaixo de 130 px de largura, troque para o <b>ícone "c"</b>. Em reels, o logo aparece no quadro final, grande, e como marca pequena no canto só se não cobrir o rosto nem os botões do Instagram.</div>
  <div class="abs mono" style="left:60px;top:664px;font-size:16px;opacity:.6">Não faça</div>
  <div class="abs" style="left:60px;top:698px;display:flex;gap:22px">
    <div class="card" style="position:relative;width:350px;height:190px;padding:10px;display:grid;place-items:center;overflow:hidden"><div style="transform:scaleX(1.5) scaleY(.7)">${LOGO('principal', 220)}</div><div class="abs no" style="right:14px;top:8px;font-size:30px;font-weight:800">✕</div></div>
    <div class="card" style="position:relative;width:350px;height:190px;padding:10px;display:grid;place-items:center;background:var(--sky)"><div>${LOGO('principal', 250)}</div><div class="abs no" style="right:14px;top:8px;font-size:30px;font-weight:800">✕</div></div>
    <div class="card" style="position:relative;width:350px;height:190px;padding:10px;display:grid;place-items:center;overflow:hidden"><div style="filter:hue-rotate(160deg)">${LOGO('principal', 250)}</div><div class="abs no" style="right:14px;top:8px;font-size:30px;font-weight:800">✕</div></div>
    <div class="card" style="position:relative;width:350px;height:190px;padding:10px;display:grid;place-items:center;overflow:hidden"><div style="transform:rotate(-14deg)">${LOGO('principal', 250, 'filter:drop-shadow(8px 10px 0 #2A1B3D)')}</div><div class="abs no" style="right:14px;top:8px;font-size:30px;font-weight:800">✕</div></div></div>
  <div class="abs note" style="left:60px;top:902px;width:1480px;font-size:18px">Não esticar ou achatar · não usar a versão principal sobre cor (use a creme ou mono) · não trocar as cores · não girar nem adicionar sombras e contornos.</div>`
/* ============================ 04 PALETA ============================ */
pages.paleta = () => `${pageHead('04', 'Cores')}
  <div class="abs h1" style="left:60px;top:88px">Paleta</div>
  ${[['Rosa chiclete', '#FF5FA2', '255 · 95 · 162', 'cor da marca · 35%', '#2A1B3D'], ['Manteiga', '#FFD84D', '255 · 216 · 77', 'destaque · sombra · 15%', '#2A1B3D'], ['Céu', '#5BC8F5', '91 · 200 · 245', 'apoio · 10%', '#2A1B3D'], ['Menta', '#7EE0B5', '126 · 224 · 181', 'apoio · 10%', '#2A1B3D'], ['Creme', '#FFF8EC', '255 · 248 · 236', 'fundo · 25%', '#2A1B3D'], ['Tinta', '#2A1B3D', '42 · 27 · 61', 'texto · escuro · 5%', '#fff']].map(([n, h, rgb, u, fg], i) => `<div class="sw" style="left:${60 + i * 252}px;top:200px;background:${h};color:${fg};${h === '#FFF8EC' ? 'border:3px solid rgba(42,27,61,.12)' : ''}"><div class="n">${n}</div><div class="m">${h}<br>RGB ${rgb}<br>${u}</div></div>`).join('')}
  <div class="abs mono" style="left:60px;top:540px;font-size:16px;opacity:.6">Texto sobre cor · contraste (mínimo 4,5 : 1 para texto pequeno)</div>
  ${[['tinta', '#2A1B3D', 'rosa', '#FF5FA2', '5,6', 1], ['tinta', '#2A1B3D', 'manteiga', '#FFD84D', '11,5', 1], ['tinta', '#2A1B3D', 'céu', '#5BC8F5', '8,3', 1], ['tinta', '#2A1B3D', 'menta', '#7EE0B5', '10,0', 1], ['tinta', '#2A1B3D', 'creme', '#FFF8EC', '15,0', 1], ['branco', '#fff', 'tinta', '#2A1B3D', '15,9', 1], ['branco', '#fff', 'rosa', '#FF5FA2', '2,8', 0], ['rosa', '#FF5FA2', 'creme', '#FFF8EC', '2,7', 0]].map(([fn, fh, bn, bh, r, ok], i) => `<div style="position:absolute;left:${60 + (i % 4) * 380}px;top:${580 + Math.floor(i / 4) * 130}px;width:358px;height:112px;border-radius:24px;background:${bh};color:${fh};padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;${bh === '#FFF8EC' ? 'border:3px solid rgba(42,27,61,.12)' : ''}"><div style="font:800 30px Outfit">${fn} em ${bn}</div><div style="font:700 15px 'JetBrains Mono'">${r} : 1 &nbsp; ${ok ? '✓ texto de qualquer tamanho' : '✕ só título gigante (40 px+)'}</div></div>`).join('')}
  <div class="abs note" style="left:60px;top:850px;width:1480px;font-size:19px"><b>Regra:</b> texto pequeno é sempre <b>tinta</b> (ou branco sobre tinta). Branco sobre rosa só em título grande e negrito, com sombra. Rosa sobre creme só em título. O verde do botão do WhatsApp (#22C55E) é exceção, por reconhecimento.</div>`
/* ============================ 05 TIPOGRAFIA ============================ */
pages.tipo = () => `${pageHead('05', 'Tipografia')}
  <div class="abs h1" style="left:60px;top:88px">Fontes</div>
  <div class="card" style="left:60px;top:200px;width:730px;height:230px"><div class="tag">Bagel Fat One · logo e títulos curtos</div><div class="disp" style="font-size:112px;line-height:1.1;color:var(--pink);text-shadow:4px 4px 0 var(--butter),8px 8px 0 var(--sky)">sua festa</div></div>
  <div class="card" style="left:810px;top:200px;width:730px;height:230px"><div class="tag">Fraunces itálico · palavra-chave</div><div class="acc" style="font-size:108px;line-height:1.1;color:var(--pink)">palavra-chave</div></div>
  <div class="card" style="left:60px;top:450px;width:730px;height:200px"><div class="tag">Outfit 800 · hook, legenda e botões · tracking apertado</div><div style="font:800 58px/1.05 Outfit;letter-spacing:-.035em;margin-top:4px">Confirme em 1 minuto</div><div style="font:500 26px Outfit;margin-top:6px">Outfit 500 · texto corrido e informações</div></div>
  <div class="card" style="left:810px;top:450px;width:730px;height:200px"><div class="tag">Caveat · notas à mão e setas</div><div class="hand" style="font-size:78px;line-height:1.05;color:var(--pink);transform:rotate(-3deg);margin-top:6px">olha que fofo! ↘</div></div>
  <div class="abs mono" style="left:60px;top:672px;font-size:16px;opacity:.6">Hierarquia (tela de 1080 px de largura)</div>
  <div class="card" style="left:60px;top:704px;width:1480px;height:236px;display:flex;gap:36px;align-items:center;padding:20px 30px">
    <div style="width:460px"><div class="t-hook" style="font-size:44px;line-height:1.15">Imagina um convite<br>assim pra <span class="mark acc" style="color:#fff;font-weight:700;letter-spacing:-.01em;z-index:1">sua festa</span></div></div>
    <div style="width:500px;font:700 15px/1.6 'JetBrains Mono';letter-spacing:0">HOOK · Outfit 800, 96 a 130 px<br>PALAVRA-CHAVE · Fraunces itálico, marcador rosa<br>LEGENDA · Outfit 800, 56 a 64 px, 2 linhas<br>CORPO · Outfit 500, 36 a 42 px<br>ROTULO · mono 24 a 28 px, caixa-alta</div>
    <div style="width:400px" class="note" style="font-size:18px">A palavra-chave vem <b>uma por tela</b>, sempre em Fraunces itálico (branca sobre marcador rosa, ou rosa sobre creme). Fontes gratuitas do Google Fonts (licença livre).</div></div>`
/* ============================ 06 ELEMENTOS ============================ */
pages.elementos = () => `${pageHead('06', 'Elementos de assinatura')}
  <div class="abs h1" style="left:60px;top:88px">Assinaturas</div>
  <div class="card" style="left:60px;top:200px;width:480px;height:200px"><div class="tag">Confete · 4 formas, 4 cores</div><div style="position:relative;height:130px">${confetti([[10,30,'r','pink',-24],[80,70,'d','butter',0],[130,20,'s','sky',8],[210,60,'z','mint',-10],[300,20,'r','butter',30],[370,70,'d','pink',0],[400,20,'s','mint',-6]], 1.2)}</div></div>
