<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --pink:#ff3d85; --violet:#7c4dff; --cyan:#0891b2; --mint:#059669; --gold:#f59e0b; --red:#ef4444; --ink:#1c1633; --mut:rgba(28,22,51,.62); }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#fbf7ff; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--ink) }
  #bg { position:absolute; inset:0; width:1080px; height:1920px }
  #stage { position:absolute; inset:0; overflow:hidden }
  .sc { position:absolute; inset:0; display:none }
  .mono { font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:30px; color:var(--cyan) }
  .h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:100px; line-height:1.02; letter-spacing:-.02em }
  .h2 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:84px; line-height:1.04; letter-spacing:-.02em }
  .grad { background:linear-gradient(95deg,var(--pink),var(--violet) 55%,var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent }
  .abs { position:absolute }
  .w { display:inline-block; will-change:transform,opacity }
  .chip { position:absolute; display:flex; align-items:center; gap:16px; padding:20px 28px; border-radius:26px; font-weight:800; font-size:38px; line-height:1.12; background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,255,255,.82)); border:2px solid rgba(124,77,255,.22); box-shadow:0 18px 44px rgba(80,60,150,.18); max-width:470px; color:var(--ink) }
  .chip i { font-style:normal; font-size:44px }
  .card { position:absolute; left:80px; width:920px; border-radius:32px; background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,255,255,.84)); border:2px solid rgba(124,77,255,.2); box-shadow:0 20px 56px rgba(80,60,150,.18); color:var(--ink) }
  .phone { position:absolute; width:560px; height:1212px; border-radius:76px; background:#0c0f1c; border:3px solid #2b3150; box-shadow:0 0 0 2px #0a0d18, 0 36px 90px rgba(60,40,130,.32), 0 0 80px var(--glow,rgba(124,77,255,.30)); transform-origin:50% 50% }
  .phone .screen { position:absolute; left:14px; top:14px; width:532px; height:1184px; border-radius:64px; overflow:hidden; background:#000 }
  .phone .shot { position:absolute; left:0; top:0; width:532px; height:1152px; object-fit:cover; object-position:top }
  .phone .notch { position:absolute; left:50%; top:26px; width:170px; height:44px; margin-left:-85px; border-radius:24px; background:#000; z-index:5 }
  .phone .scan { position:absolute; left:0; right:0; height:220px; background:linear-gradient(180deg,transparent,rgba(8,145,178,.14),transparent); z-index:4 }
  .brk { position:absolute; width:70px; height:70px; border:6px solid var(--violet); filter:drop-shadow(0 0 8px rgba(124,77,255,.45)) }
  .ripple { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:6px solid #fff; z-index:6 }
  .bubble { position:absolute; padding:24px 32px; border-radius:34px; font-weight:700; font-size:38px; max-width:560px; background:#fff; color:var(--ink); border:2px solid rgba(124,77,255,.18); box-shadow:0 14px 36px rgba(80,60,150,.16) }
  .big { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; letter-spacing:-.03em; line-height:.95 }
  .btn { position:absolute; left:140px; width:800px; height:170px; border-radius:90px; display:flex; align-items:center; justify-content:center; gap:22px; font-weight:800; font-size:56px; background:linear-gradient(95deg,#22c55e,#10b981); box-shadow:0 0 0 0 rgba(34,197,94,.6), 0 24px 80px rgba(16,185,129,.5) }
  #flash { position:absolute; inset:0; background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9),rgba(124,77,255,.35)); opacity:0; z-index:50; pointer-events:none }
  #vig { position:absolute; inset:0; z-index:40; pointer-events:none; background:radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(110,80,190,.12)) }
  .wa { position:absolute; width:700px; border-radius:46px; overflow:hidden; background:#efeae2; border:3px solid #d5d1c7; box-shadow:0 36px 90px rgba(60,40,130,.28), 0 0 70px rgba(34,197,94,.22) }
  .wa .hd { height:120px; background:#008069; color:#fff; display:flex; align-items:center; gap:22px; padding:0 30px; font-weight:800; font-size:38px }
  .wa .av { width:70px; height:70px; border-radius:50%; background:linear-gradient(135deg,#f9a8d4,#fcd34d); display:grid; place-items:center; font-size:38px }
  .wa .bd { padding:26px 22px 40px; background:#efeae2; position:relative; height:1070px }
  .msg { position:absolute; left:18px; width:590px; color:#111; background:#d9fdd3; border-radius:30px 30px 30px 8px; padding:12px; box-shadow:0 8px 30px rgba(0,0,0,.4) }
  .msg .pv { border-radius:22px; overflow:hidden; background:#c5ecc0 }
  .msg .pv img { width:100%; display:block }
  .msg .pv .tx { padding:14px 18px 16px }
  .msg .tt { font-weight:800; font-size:30px; color:#111 }
  .msg .ds { font-size:25px; color:rgba(17,17,17,.65); margin-top:4px; line-height:1.25 }
  .msg .tx2 { padding:16px 10px 6px; font-size:31px; line-height:1.28; color:#111; white-space:pre-line }
  .msg .tm { text-align:right; font-size:22px; color:rgba(17,17,17,.45); padding:0 8px 4px }
</style></head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="stage"></div>
<div id="vig"></div>
<div id="flash"></div>
<script>
/* ============================ utilidades ============================ */
const FPS = 30, BPM = 120.3, BEAT = 60 / BPM
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, k) => a + (b - a) * k
const E = {
  out: (k) => 1 - Math.pow(1 - k, 3), in: (k) => k * k * k, io: (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  back: (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2) },
  spring: (k) => 1 - Math.exp(-6 * k) * Math.cos(10 * k),
}
const P = (t, t0, d) => clamp((t - t0) / d)
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild }
const stage = document.getElementById('stage')
const EVENTS = new Map()   // efeitos sonoros: { t, type }, sem repetir
const ev = (t, type) => EVENTS.set(type + '@' + t.toFixed(3), { t: +t.toFixed(3), type })

/* linha do tempo em batidas (cada cena começa numa batida da música) */
const B = [6, 10, 5, 16, 16, 13, 10, 8, 11]
const T0 = []; { let a = 0; for (const n of B) { T0.push(a * BEAT); a += n } }
const TOTAL = B.reduce((a, b) => a + b, 0) * BEAT
const S = (i) => ({ a: T0[i], b: T0[i] + B[i] * BEAT, d: B[i] * BEAT })

/* ============================ fundo (canvas) ============================ */
const cv = document.getElementById('bg'), cx = cv.getContext('2d')
const rnd = (s) => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
const stars = Array.from({ length: 150 }, (_, i) => ({ x: rnd(i) * 1080, y: rnd(i + 99) * 1920, r: .6 + rnd(i + 5) * 2.1, f: 1 + rnd(i + 9) * 3 }))
function drawBg(t) {
  const beat = Math.exp(-((t % BEAT) / BEAT) * 5)
  const g = cx.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#fff8fc'); g.addColorStop(.5, '#f5f1ff'); g.addColorStop(1, '#e9f6ff')
  cx.fillStyle = g; cx.fillRect(0, 0, 1080, 1920)
  const orb = (x, y, r, c, a) => { const rg = cx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c.replace('A', a)); rg.addColorStop(1, c.replace('A', 0)); cx.fillStyle = rg; cx.fillRect(x - r, y - r, r * 2, r * 2) }
  orb(200 + Math.sin(t * .5) * 120, 420 + Math.cos(t * .4) * 100, 640, 'rgba(255,77,141,A)', .24 + beat * .08)
  orb(900 + Math.cos(t * .45) * 100, 1180 + Math.sin(t * .35) * 140, 720, 'rgba(34,211,238,A)', .2 + beat * .07)
  orb(540, 1780, 660, 'rgba(124,77,255,A)', .2)
  cx.save(); cx.strokeStyle = 'rgba(124,77,255,.55)'; cx.lineWidth = 2
  const hy = 1250, sp = (t * .55) % 1
  for (let i = 0; i < 13; i++) { const k = (i + sp) / 13, y = hy + Math.pow(k, 2.1) * 670; cx.globalAlpha = .08 + k * .38; cx.beginPath(); cx.moveTo(0, y); cx.lineTo(1080, y); cx.stroke() }
  cx.globalAlpha = .3
  for (let i = -9; i <= 9; i++) { cx.beginPath(); cx.moveTo(540 + i * 36, hy); cx.lineTo(540 + i * 215, 1920); cx.stroke() }
  cx.restore()
  const cols = ['255,77,141', '124,77,255', '8,145,178']
  stars.forEach((s_, i) => { const a = .12 + .3 * (.5 + .5 * Math.sin(t * s_.f + s_.x)); cx.fillStyle = `rgba(${cols[i % 3]},${a})`; cx.beginPath(); cx.arc(s_.x, (s_.y + t * 6 * s_.f) % 1920, s_.r * 1.2, 0, 6.3); cx.fill() })
}

/* ============================ componentes ============================ */
function words(el, text) {
  const toks = []
  text.replace(/\{\{(.*?)\}\}|(\S+)/g, (m, g, w) => { if (g) g.split(' ').forEach((x) => toks.push([x, true])); else toks.push([w, false]) })
  el.innerHTML = toks.map(([w, gr]) => `<span class="w ${gr ? 'grad' : ''}">${w}</span>`).join(' ')
  return [...el.querySelectorAll('.w')]
}
function revealWords(ws, t, t0, step = .09, dur = .4) {
  ws.forEach((w, i) => { const k = E.out(P(t, t0 + i * step, dur)); w.style.opacity = k; w.style.transform = `translateY(${(1 - k) * 46}px) scale(${.94 + .06 * k})`; w.style.filter = `blur(${(1 - k) * 10}px)` })
}
function setT(el, x, y, o = 1, s = 1, r = 0) { el.style.opacity = o; el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)` }
function mkPhone(shots, o = {}) {
  const ph = $(`<div class="phone"><div class="screen">${shots.map((s) => `<img class="shot" src="${s}">`).join('')}<div class="scan"></div></div><div class="notch"></div></div>`)
  if (o.glow) ph.style.setProperty('--glow', o.glow)
  return ph
}
/* mostra a sequência de capturas dentro do celular: [{i, a, b, mode}] */
function playShots(ph, seq, t, xf = .28) {
  const imgs = ph.querySelectorAll('.shot')
  imgs.forEach((im, i) => {
    const s = seq.find((q) => q.i === i); if (!s) { im.style.opacity = 0; return }
    const inK = E.out(P(t, s.a, xf)), outK = 1 - E.in(P(t, s.b - xf, xf))
    im.style.opacity = Math.min(inK, outK) * (t >= s.a && t <= s.b ? 1 : 0)
    const dy = s.mode === 'up' ? (1 - inK) * 120 : s.mode === 'scroll' ? -(P(t, s.a, s.b - s.a)) * (s.dist || 0) : 0
    const z = s.zoom ? 1 + (s.zoom - 1) * P(t, s.a, s.b - s.a) : 1
    im.style.transform = `translateY(${dy}px) scale(${z})`
  })
  ph.querySelector('.scan').style.top = `${-220 + ((t * 520) % 1500)}px`
}
function ripple(el, t, t0, x, y) {
  const k = P(t, t0, .55); el.style.left = x + 'px'; el.style.top = y + 'px'
  el.style.opacity = k > 0 && k < 1 ? 1 - k : 0; el.style.transform = `scale(${.3 + k * 1.3})`
}
function counter(el, t, t0, d, from, to, fmt = (n) => Math.round(n)) { const k = E.out(P(t, t0, d)); el.textContent = fmt(lerp(from, to, k)) }
function chipEl(icon, text, css = '') { return $(`<div class="chip" style="${css}"><i>${icon}</i><span>${text}</span></div>`) }
function chipAnim(el, t, t0, x, y, side = 1) {
  const k = E.back(P(t, t0, .5)); const fl = Math.sin(t * 1.7 + x) * 7
  el.style.opacity = clamp(P(t, t0, .2)); el.style.transform = `translate(${x + (1 - k) * 90 * side}px,${y + fl}px) scale(${.7 + .3 * k})`
}
function brackets(box) { return ['tl', 'tr', 'bl', 'br'].map((p) => { const b = $('<div class="brk"></div>'); b.style.cssText += (p[0] === 't' ? 'top:0;' : 'bottom:0;') + (p[1] === 'l' ? 'left:0;' : 'right:0;') + `border-${p[0] === 't' ? 'bottom' : 'top'}:none;border-${p[1] === 'l' ? 'right' : 'left'}:none;`; box.appendChild(b); return b }) }

/* ============================ cenas ============================ */
const scenes = []
const add = (i, build, update) => { const el = $('<div class="sc"></div>'); stage.appendChild(el); const ctx = build(el, S(i)); scenes.push({ i, el, ctx, update, ...S(i) }) }

/* ---- 1. GANCHO ---- */
add(0, (el, s) => {
  const tag = $('<div class="mono abs" style="left:80px;top:250px">// antes da festa</div>')
  const h = $('<div class="h1 abs" style="left:80px;top:330px;width:920px"></div>')
  const ws = words(h, 'Você sabe quantos convidados vão {{MESMO}} à festa?')
  const bub = ['vai ou não vai? 🤔', 'esqueci de responder 😅', 'quantas crianças vão?', 'me manda o endereço de novo']
    .map((tx, i) => { const b = $(`<div class="bubble">${tx}</div>`); el.appendChild(b); return b })
  const ico = $('<div class="abs" style="left:760px;top:1010px;width:210px;height:210px;border-radius:52px;background:linear-gradient(135deg,#25d366,#128c7e);display:grid;place-items:center;box-shadow:0 20px 56px rgba(37,211,102,.4)"><svg width="120" height="120" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg></div>')
  const badge = $('<div class="abs" style="left:900px;top:975px;min-width:96px;height:96px;padding:0 18px;border-radius:48px;background:#ff3b4e;display:grid;place-items:center;font-weight:800;font-size:52px;border:6px solid #fbf7ff">1</div>')
  el.append(tag, h, ico, badge)
  return { tag, ws, bub, ico, badge }
}, (c, t, s) => {
  const lt = t - s.a
  setT(c.tag, 0, 0, E.out(P(lt, .05, .3)))
  revealWords(c.ws, lt, .15, .12)
  const pos = [[90, 1000], [330, 1160], [70, 1330], [380, 1480]]
  c.bub.forEach((b, i) => { const k = E.back(P(lt, .9 + i * .42, .45)); setT(b, pos[i][0] + (i % 2 ? 80 : -80) * (1 - k), pos[i][1], clamp(P(lt, .9 + i * .42, .2)), .8 + .2 * k, (i % 2 ? 2 : -2) * (1 - k)); ev(s.a + .9 + i * .42, 'pop') })
  const n = Math.min(99, Math.round(1 + E.in(P(lt, .8, 2.0)) * 98)); c.badge.textContent = lt > 2.7 ? '99+' : n
  const sh = lt > 1.6 ? Math.sin(lt * 40) * 4 * E.out(P(lt, 1.6, .2)) * (1 - P(lt, 2.4, .5)) : 0
  setT(c.ico, sh, 0, E.out(P(lt, .6, .35)), 1 + .06 * Math.sin(lt * 10) * P(lt, 1.2, 1))
  c.badge.style.transform = `translateX(${sh}px) scale(${1 + .15 * Math.sin(lt * 14) * P(lt, 1.2, 1.6)})`
})

/* ---- 2. O JEITO ANTIGO ---- */
const PAIN = [['📋', 'Planilha que ninguém atualiza'], ['💬', 'Grupo de WhatsApp virou bagunça'], ['📞', 'Ligar convidado por convidado'], ['🤯', 'Quantas crianças? Quantos adultos?']]
add(1, (el, s) => {
  const tag = $('<div class="mono abs" style="left:80px;top:250px;color:#e11d48">// o jeito antigo</div>')
  const cards = PAIN.map(([ic, tx], i) => {
    const c = $(`<div class="card" style="top:${340 + i * 215}px;height:180px;display:flex;align-items:center;gap:26px;padding:0 160px 0 36px;font-weight:800;font-size:40px;line-height:1.12"><i style="font-style:normal;font-size:70px">${ic}</i><span class="tx">${tx}</span><div class="strike" style="position:absolute;left:30px;top:50%;height:8px;width:740px;background:var(--red);border-radius:4px;transform-origin:left;box-shadow:0 0 24px var(--red)"></div><div class="x" style="position:absolute;right:30px;top:50%;margin-top:-52px;width:104px;height:104px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:64px;font-weight:800">✕</div></div>`)
    el.appendChild(c); return c
  })
  const end = $('<div class="h2 abs" style="left:80px;top:1250px;width:920px;text-align:left">Festa de 1 ano já dá <span class="grad">trabalho demais.</span></div>')
  const ws = []
  el.append(tag, end)
  return { tag, cards, end }
}, (c, t, s) => {
  const lt = t - s.a
  setT(c.tag, 0, 0, E.out(P(lt, 0, .3)))
  c.cards.forEach((cd, i) => {
    const t0 = .15 + i * .85, k = E.back(P(lt, t0, .45))
    setT(cd, (1 - k) * 700, 0, clamp(P(lt, t0, .2)), 1)
    const sk = E.out(P(lt, t0 + .45, .25)); cd.querySelector('.strike').style.transform = `scaleX(${sk})`
    const xk = E.back(P(lt, t0 + .55, .3)); cd.querySelector('.x').style.transform = `scale(${xk})`; cd.querySelector('.x').style.opacity = P(lt, t0 + .55, .1)
    cd.querySelector('.tx').style.opacity = 1 - .45 * sk
    ev(s.a + t0, 'whoosh'); ev(s.a + t0 + .5, 'buzz')
  })
  const k = E.out(P(lt, 3.55, .5)); const g = Math.sin(lt * 50) * 6 * (1 - P(lt, 3.55, .6))
  c.end.style.opacity = k; c.end.style.transform = `translateY(${(1 - k) * 60}px)`; c.end.style.textShadow = `${g}px 0 rgba(255,0,100,.8), ${-g}px 0 rgba(0,220,255,.8)`
})

/* ---- 3. VIRADA ---- */
add(2, (el, s) => {
  const h = $('<div class="h1 abs" style="left:80px;top:470px;width:920px;text-align:center;font-size:104px"></div>')
  const ws = words(h, 'E se o próprio {{convite}} cuidasse de tudo isso?')
  const lab = $('<div class="mono abs" style="left:80px;top:1100px;width:920px;text-align:center;font-size:28px">iniciando convite inteligente…</div>')
  const bar = $('<div class="abs" style="left:140px;top:1170px;width:800px;height:34px;border-radius:20px;background:rgba(28,22,51,.10);overflow:hidden"><div class="f" style="height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 0 30px var(--cyan)"></div></div>')
  const pct = $('<div class="big abs" style="left:80px;top:1230px;width:920px;text-align:center;font-size:120px">0%</div>')
  const ok = $('<div class="mono abs" style="left:80px;top:1400px;width:920px;text-align:center;font-size:40px;color:var(--mint)">✓ sistema ativo</div>')
  el.append(h, lab, bar, pct, ok); return { ws, lab, bar, pct, ok }
}, (c, t, s) => {
  const lt = t - s.a
  revealWords(c.ws, lt, .1, .1)
  const k = E.io(P(lt, .6, 1.5)); c.bar.querySelector('.f').style.width = k * 100 + '%'; c.pct.textContent = Math.round(k * 100) + '%'
  setT(c.lab, 0, 0, E.out(P(lt, .5, .3))); setT(c.bar, 0, 0, E.out(P(lt, .5, .3))); setT(c.pct, 0, 0, E.out(P(lt, .5, .3)))
  const o = E.back(P(lt, 2.15, .3)); setT(c.ok, 0, 0, P(lt, 2.15, .1), o)
  ev(s.a + 2.15, 'chime')
})

/* ---- 4. PARA OS CONVIDADOS ---- */
add(3, (el, s) => {
  const tag = $('<div class="mono abs" style="left:80px;top:240px">01 · para os convidados</div>')
  const h = $('<div class="h2 abs" style="left:80px;top:290px;width:920px"></div>'); const ws = words(h, 'Só digitam {{o nome.}}')
  const ph = mkPhone(['stills/g-1-entrada.png', 'stills/g-2-digitando.png', 'stills/g-4-rsvp.png', 'stills/g-5-hero.png', 'stills/g-6-hist.png', 'stills/g-7-hist.png'])
  ph.style.left = '500px'; ph.style.top = '470px'
  const rp = $('<div class="ripple"></div>'); ph.querySelector('.screen').appendChild(rp)
  const bs = brackets(ph); bs.forEach((b) => { b.style.margin = '-30px' })
  const chips = [chipEl('📵', 'Sem app<br>e sem cadastro'), chipEl('🔤', 'Aceita sem acento<br>e sem maiúscula'), chipEl('👨‍👩‍👧', 'Responde pela<br>família toda'), chipEl('👵', 'Até a vovó<br>consegue')]
  el.append(tag, h, ph); chips.forEach((c) => el.appendChild(c))
  return { tag, ws, ph, rp, chips }
}, (c, t, s) => {
  const lt = t - s.a
  setT(c.tag, 0, 0, E.out(P(lt, .1, .3))); revealWords(c.ws, lt, .15, .12)
  const k = E.back(P(lt, .05, .6)); setT(c.ph, 0, 0, clamp(P(lt, .05, .25)), .9 * (.85 + .15 * k)); c.ph.style.transformOrigin = '50% 0'

/* ============================ renderização ============================ */
const flash = document.getElementById('flash')
function render(t) {
  drawBg(t)
  for (const sc of scenes) {
    const on = t >= sc.a - .0001 && t < sc.b + .0001
    sc.el.style.display = on ? 'block' : 'none'
    if (on) { const k = P(t, sc.a, .2), o = P(t, sc.b - .12, .12); sc.el.style.opacity = Math.min(E.out(k), 1 - o * .0); sc.update(sc.ctx, t, sc) }
  }
  // flash nas viradas de cena + pulso na batida
  let f = 0; for (const a of T0.slice(1)) { const d = t - a; if (d >= 0 && d < .18) f = Math.max(f, .55 * (1 - d / .18)) }
  flash.style.opacity = f
}
async function collectEvents() { EVENTS.clear(); for (let t = 0; t <= TOTAL; t += 1 / 10) render(t); return [...EVENTS.values()].sort((a, b) => a.t - b.t) }
window.render = render; window.TOTAL = TOTAL; window.T0 = T0; window.collectEvents = collectEvents
window.ready = document.fonts.ready.then(() => new Promise((r) => { const imgs = [...document.images]; Promise.all(imgs.map((i) => (i.complete ? 1 : new Promise((res) => { i.onload = i.onerror = res })))).then(r) }))
</script>
