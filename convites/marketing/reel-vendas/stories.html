<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#f4f4f6; font-family:'Plus Jakarta Sans',sans-serif; color:#1d1b26 }
  #bg { position:absolute; inset:0 }
  .h { position:absolute; left:60px; top:260px; width:960px; text-align:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:92px; line-height:1.03; letter-spacing:-.025em }
  .grad { background:linear-gradient(95deg,var(--c1),var(--c2) 55%,var(--c3)); -webkit-background-clip:text; background-clip:text; color:transparent }
  .panel { position:absolute; left:190px; top:560px; width:700px; height:1060px; filter:drop-shadow(0 30px 60px var(--glow)) }
  .panel .s { position:absolute; inset:0; border-radius:48px; overflow:hidden; background:#fff; opacity:.96;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 78%,transparent); -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 78%,transparent); mask-composite:intersect }
  .panel img { position:absolute; left:0; width:700px; height:1515px; object-fit:cover }
  .gc { position:absolute; display:flex; align-items:center; gap:18px; padding:22px 26px; border-radius:30px; font-weight:800; font-size:31px; line-height:1.15; z-index:3; max-width:350px;
    background:linear-gradient(140deg,rgba(255,255,255,.76),rgba(255,255,255,.32)); backdrop-filter:blur(18px) saturate(1.5); border:1.5px solid rgba(255,255,255,.9);
    box-shadow:0 20px 54px rgba(40,40,70,.12), 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent), 0 0 38px color-mix(in srgb,var(--ac) 28%,transparent), inset 0 1px 0 #fff }
  .gc i { font-style:normal; font-size:46px }
  .row { position:absolute; left:90px; width:900px; display:flex; align-items:center; gap:28px; padding:30px 36px; border-radius:34px; background:rgba(255,255,255,.72); backdrop-filter:blur(14px); border:1.5px solid rgba(255,255,255,.9); box-shadow:0 16px 44px rgba(40,40,70,.10); font-weight:800; font-size:44px; line-height:1.15 }
  .row i { font-style:normal; font-size:62px }
  .num { width:84px; height:84px; border-radius:50%; display:grid; place-items:center; font:800 44px 'Bricolage Grotesque'; color:#fff; background:linear-gradient(135deg,var(--c1),var(--c2)); flex:none; box-shadow:0 10px 26px color-mix(in srgb,var(--c2) 40%,transparent) }
  .btn { position:absolute; left:140px; width:800px; height:150px; border-radius:90px; display:flex; align-items:center; justify-content:center; gap:22px; font-weight:800; font-size:52px; color:#fff; background:linear-gradient(95deg,#22c55e,#10b981); box-shadow:0 24px 60px rgba(16,185,129,.4); z-index:5 }
  .q { position:absolute; padding:30px 42px; border-radius:46px 46px 46px 10px; background:#fff; font-weight:800; font-size:52px; line-height:1.12; box-shadow:0 18px 50px rgba(40,40,70,.13); border:2px solid rgba(29,27,38,.05) }
  .ans { position:absolute; right:60px; width:880px; padding:36px 46px 40px; border-radius:50px 50px 10px 50px; background:linear-gradient(140deg,rgba(255,255,255,.8),rgba(255,255,255,.36)); backdrop-filter:blur(18px); border:1.5px solid rgba(255,255,255,.95); box-shadow:0 26px 70px rgba(40,40,70,.13), 0 0 0 1px color-mix(in srgb,var(--c1) 35%,transparent), 0 0 50px color-mix(in srgb,var(--c2) 22%,transparent), inset 0 1px 0 #fff }
  .ans .big { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:80px; line-height:1; letter-spacing:-.03em }
  .ans .d { margin-top:16px; font-weight:700; font-size:32px; line-height:1.3; color:rgba(29,27,38,.62) }
  .cover { position:absolute; left:230px; top:650px; width:620px; height:620px; border-radius:50%; display:grid; place-items:center; font-size:290px;
    background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,255,255,.35)); backdrop-filter:blur(10px); border:2px solid rgba(255,255,255,.95);
    box-shadow:0 40px 90px rgba(40,40,70,.18), 0 0 0 14px color-mix(in srgb,var(--c1) 22%,transparent), 0 0 0 28px color-mix(in srgb,var(--c2) 14%,transparent), 0 0 120px color-mix(in srgb,var(--c2) 40%,transparent), inset 0 2px 0 #fff }
  .cover span { filter:drop-shadow(0 18px 24px rgba(40,40,70,.22)) }
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div class="h" id="h"></div>
<div id="ct"></div>
<script>
const TH = {
  safari:{ c1:'#2f6b3a', c2:'#e08a2b', c3:'#8e5bb5', glow:'rgba(47,107,58,.28)', a:['#2f6b3a','#e08a2b','#8e5bb5'], pal:['47,107,58','224,138,43','122,154,58','142,91,181','228,87,156','46,159,122'] },
  jardim:{ c1:'#8e5bb5', c2:'#e4579c', c3:'#2e9f7a', glow:'rgba(142,91,181,.30)', a:['#8e5bb5','#e4579c','#2e9f7a'], pal:['142,91,181','228,87,156','46,159,122','181,127,214','240,171,205','111,191,155'] } }
const cc = (i, th) => th.a[i % 3]
const H = {
 como:[
  { th:'jardim', kind:'steps', h:'Como funciona<br><span class="grad">em 4 passos</span>', steps:['Você manda as informações','A gente monta tudo','Você recebe o painel e os links','Envia no WhatsApp e acompanha'] },
  { th:'jardim', kind:'form', h:'Passo 1<br><span class="grad">você manda as infos</span>', items:[['👶','Nome e fotos do bebê'],['📅','Data, hora e local da festa'],['🎨','Tema: Safari ou Jardim'],['👨‍👩‍👧','Lista de convidados']], foot:'Por um formulário no WhatsApp.' },
  { th:'safari', kind:'panel', h:'Passo 2<br><span class="grad">a gente monta tudo</span>', img:'g-5-hero.png', y:0, cards:[['🦁','Fotos, história e tema',-1,760],['✍️','Do jeito da sua família',1,1130]] },
  { th:'jardim', kind:'panel', h:'Passo 3<br><span class="grad">você recebe o painel</span>', img:'stills_j/a-1-visao.png', y:-10, cards:[['🔐','Acesso ao seu painel',-1,760],['🔗','Link pessoal de cada família',1,1130]] },
  { th:'safari', kind:'panel', h:'Passo 4<br><span class="grad">envia e acompanha</span>', img:'a-3b-enviar.png', y:-10, cards:[['💬','Mensagem pronta no WhatsApp',-1,760],['📊','Respostas ao vivo',1,1130]] },
  { th:'jardim', kind:'cta', h:'Quer começar?<br><span class="grad">Chama a gente</span>' } ],
 temas:[
  { th:'safari', kind:'panel', h:'Tema<br><span class="grad">Safari</span>', img:'g-5-hero.png', y:0, cards:[['🦁','Aventura e bichinhos',-1,760],['🌴','Emojis caem na tela',1,1130]] },
  { th:'jardim', kind:'panel', h:'Tema<br><span class="grad">Jardim Encantado</span>', img:'j-5-hero.png', y:0, cards:[['🦋','Flores e borboletas',-1,760],['🌸','Emojis caem na tela',1,1130]] },
  { th:'safari', kind:'cta', h:'Qual vai ser o<br><span class="grad">tema da sua festa?</span>' } ],
 painel:[
  { th:'jardim', kind:'panel', h:'Tudo contado,<br><span class="grad">ao vivo</span>', img:'stills_j/a-1-visao.png', y:-10, cards:[['✅','Confirmados e pendentes',-1,760],['👨‍👩‍👧','Resposta por família',1,1130]] },
  { th:'jardim', kind:'panel', h:'Vagas do <span class="grad">pai</span><br>e da <span class="grad">mãe</span>', img:'stills_j/a-2-visao2.png', y:-90, cards:[['👩‍🍼','Vagas de cada anfitrião',-1,1200],['🎟️','Controle de gratuidades',1,1330]] },
  { th:'jardim', kind:'panel', h:'Lembrete em<br><span class="grad">1 toque</span>', img:'stills_j/a-4-lembretes.png', y:-10, cards:[['⏰','Só quem não respondeu',-1,780],['💬','Mensagem pronta no WhatsApp',1,1130]] },
  { th:'jardim', kind:'panel', btn:true, h:'Lista pra<br><span class="grad">imprimir</span>', img:'stills_j/a-5-pessoas.png', y:-10, cards:[['🖨️','PDF por família',-1,780],['🔎','Filtre por anfitrião e idade',1,1050]] } ],
 duvidas:[
  { th:'jardim', kind:'qa2', h:'Dúvidas<br><span class="grad">que toda mãe tem</span>', qa:[['Complicado pros convidados?','Só digitam o nome.','Respondem pela família toda, em 1 minuto.'],['Dá trabalho pra mim?','A gente monta tudo.','Você responde um formulário no WhatsApp e recebe o convite pronto.']] },
  { th:'jardim', kind:'qa2', h:'Mais<br><span class="grad">dúvidas</span>', qa:[['Preciso de app?','Não.','Nem você, nem os convidados. Tudo abre pelo link do WhatsApp.'],['E se mudarem de ideia?','Atualiza pelo mesmo link.','A resposta muda e o seu painel acompanha.']] },
  { th:'jardim', kind:'cta', h:'Ficou com<br><span class="grad">outra dúvida?</span>' } ]
}
const COVERS = { como:['✨','jardim'], temas:['🎨','safari'], painel:['📊','jardim'], duvidas:['💬','jardim'] }
const qs = new URLSearchParams(location.search), hl = qs.get('h'), idx = +qs.get('s') - 1
const isCover = qs.get('cover') === '1'
const sl = isCover ? { th:COVERS[hl][1] } : H[hl][idx], th = TH[sl.th]
const r = document.documentElement.style; ['c1','c2','c3','glow'].forEach(k => r.setProperty('--'+k, th[k]))
const cx = document.getElementById('bg').getContext('2d'), rnd = (s) => { const x = Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x) }
const n = idx + 3, pal = th.pal
const g = cx.createLinearGradient(0,0,0,1920); g.addColorStop(0,'#fff'); g.addColorStop(.55,'#f3f3f6'); g.addColorStop(1,'#e6e7ec'); cx.fillStyle = g; cx.fillRect(0,0,1080,1920)
const orb = (x,y,rad,c,a) => { const rg = cx.createRadialGradient(x,y,0,x,y,rad); rg.addColorStop(0,`rgba(${c},${a})`); rg.addColorStop(1,`rgba(${c},0)`); cx.fillStyle = rg; cx.fillRect(x-rad,y-rad,rad*2,rad*2) }
orb(180,380+(n*90)%260,640,pal[1],.12); orb(920,560,580,pal[3],.10); orb(260,1560,660,pal[0],.10); orb(900,1500,620,pal[4],.10)
cx.strokeStyle = 'rgba(90,90,110,.5)'; cx.lineWidth = 2
for (let i=0;i<12;i++){ const k=i/12, y=1500+Math.pow(k,2.1)*420; cx.globalAlpha=.05+k*.2; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke() }
cx.globalAlpha=.14; for (let i=-9;i<=9;i++){ cx.beginPath(); cx.moveTo(540+i*36,1500); cx.lineTo(540+i*200,1920); cx.stroke() }
cx.globalAlpha=1
for (let i=0;i<60;i++){ cx.fillStyle=`rgba(${pal[i%6]},${.12+.2*rnd(i+3+n)})`; cx.beginPath(); cx.arc(rnd(i+n)*1080,rnd(i+99+n)*1920,3+rnd(i+5)*7,0,6.3); cx.fill() }
const h = document.getElementById('h'), ct = document.getElementById('ct')
const WA = '<svg width="76" height="76" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>'
let imgs = []
if (isCover) {
  document.getElementById('h').style.display = 'none'
  ct.innerHTML = `<div class="cover"><span>${COVERS[hl][0]}</span></div>`
} else {
  h.innerHTML = sl.h
  if (sl.kind === 'steps') {
    ct.innerHTML = sl.steps.map((t,i) => `<div class="row" style="top:${600 + i*200}px"><span class="num">${i+1}</span><span>${t}</span></div>`).join('')
  } else if (sl.kind === 'form') {
    ct.innerHTML = sl.items.map(([ic,t],i) => `<div class="row" style="top:${600 + i*190}px"><i>${ic}</i><span>${t}</span></div>`).join('') +
      `<div style="position:absolute;left:0;top:1420px;width:1080px;text-align:center;font-weight:700;font-size:38px;color:rgba(29,27,38,.6)">${sl.foot}</div>`
  } else if (sl.kind === 'panel') {
    const src = sl.img.includes('/') ? sl.img : 'stills/' + sl.img
    ct.innerHTML = `<div class="panel"><div class="s"><img src="${src}" style="top:${sl.y}px"></div></div>` +
      sl.cards.map(([ic,tx,side,y],i) => `<div class="gc" style="--ac:${cc(i,th)};top:${y}px;${side<0 ? 'left:36px' : 'right:36px'}"><i>${ic}</i><span>${tx}</span></div>`).join('') +
      (sl.btn ? `<div class="btn" style="top:1620px">${WA}<span>Chama no WhatsApp</span></div>` : '')
    imgs = [...ct.querySelectorAll('img')]
  } else if (sl.kind === 'qa2') {
    h.style.fontSize = '84px'
    ct.innerHTML = sl.qa.map(([q,a,d],i) => { const y = 590 + i*520
      return `<div class="q" style="left:60px;top:${y}px">${q}</div><div class="ans" style="top:${y+130}px"><div class="big grad">${a}</div><div class="d">${d}</div></div>` }).join('')
  } else if (sl.kind === 'cta') {
    h.style.top = '480px'; h.style.fontSize = '104px'
    ct.innerHTML = `<div class="btn" style="top:900px">${WA}<span>Chama no WhatsApp</span></div>
      <div style="position:absolute;left:0;top:1110px;width:1080px;text-align:center;font-weight:800;font-size:46px"><span style="font-size:64px;display:inline-block">☝️</span><br>Link na bio</div>
      <img src="stills/logo.png" style="position:absolute;left:330px;top:1230px;width:420px;mix-blend-mode:multiply">`
    imgs = [...ct.querySelectorAll('img')]
  }
}
window.ready = Promise.all([document.fonts.ready, ...imgs.map(i => i.complete ? 1 : new Promise(r => i.onload = r))])
</script></body></html>
