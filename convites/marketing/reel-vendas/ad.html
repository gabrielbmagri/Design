<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { width:1080px; height:1080px; overflow:hidden; background:#f4f4f6; font-family:'Plus Jakarta Sans',sans-serif; color:#1d1b26 }
  #bg { position:absolute; inset:0 }
  .h { position:absolute; left:72px; top:96px; width:560px; white-space:nowrap; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:70px; line-height:1.04; letter-spacing:-.025em }
  .grad { background:linear-gradient(95deg,var(--c1),var(--c2) 55%,var(--c3)); -webkit-background-clip:text; background-clip:text; color:transparent }
  .sub { position:absolute; left:72px; top:420px; width:480px; font-weight:700; font-size:30px; line-height:1.3; color:rgba(29,27,38,.62) }
  .panel { position:absolute; left:570px; top:70px; width:510px; height:1010px; filter:drop-shadow(0 30px 60px var(--glow)) }
  .panel .s { position:absolute; inset:0; border-radius:44px; overflow:hidden; background:#fff; opacity:.96;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 100%),linear-gradient(to bottom,transparent,#000 4%,#000 74%,transparent); -webkit-mask-composite:source-in;
    mask-image:linear-gradient(to right,transparent,#000 9%,#000 100%),linear-gradient(to bottom,transparent,#000 4%,#000 74%,transparent); mask-composite:intersect }
  .panel img { position:absolute; left:0; top:0; width:510px; height:1104px; object-fit:cover; object-position:top }
  .gc { position:absolute; left:72px; width:420px; display:flex; align-items:center; gap:18px; padding:20px 24px; border-radius:28px; font-weight:800; font-size:30px; line-height:1.15;
    background:linear-gradient(140deg,rgba(255,255,255,.72),rgba(255,255,255,.3)); backdrop-filter:blur(18px) saturate(1.5); border:1.5px solid rgba(255,255,255,.9);
    box-shadow:0 20px 54px rgba(40,40,70,.12), 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent), 0 0 38px color-mix(in srgb,var(--ac) 28%,transparent), inset 0 1px 0 #fff }
  .gc i { font-style:normal; font-size:44px }
  .btn { position:absolute; left:72px; top:900px; width:520px; height:104px; border-radius:60px; display:flex; align-items:center; justify-content:center; gap:16px; font-weight:800; font-size:36px; color:#fff; background:linear-gradient(95deg,#22c55e,#10b981); box-shadow:0 18px 44px rgba(16,185,129,.38) }
</style></head><body>
<canvas id="bg" width="1080" height="1080"></canvas>
<div class="h" id="h"></div>
<div class="sub">Confirmação em 1 minuto,<br>sem app e sem cadastro.</div>
<div class="gc" id="g1" style="top:560px"><i>👨‍👩‍👧</i><span>Resposta por família</span></div>
<div class="gc" id="g2" style="top:700px;left:110px"><i>📊</i><span>Lista ao vivo no seu painel</span></div>
<div class="panel"><div class="s"><img id="shot"></div></div>
<div class="btn"><svg width="46" height="46" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg><span>Chama no WhatsApp</span></div>
<script>
const T = {
  safari: { c1:'#2f6b3a', c2:'#e08a2b', c3:'#8e5bb5', glow:'rgba(47,107,58,.28)', img:'stills/g-5-hero.png', a1:'#2f6b3a', a2:'#e08a2b', pal:['47,107,58','224,138,43','122,154,58','142,91,181','228,87,156','46,159,122'] },
  jardim:{ c1:'#8e5bb5', c2:'#e4579c', c3:'#2e9f7a', glow:'rgba(142,91,181,.30)', img:'stills/j-5-hero.png', a1:'#8e5bb5', a2:'#e4579c', pal:['142,91,181','228,87,156','46,159,122','181,127,214','240,171,205','111,191,155'] } }
const th = T[new URLSearchParams(location.search).get('t') || 'jardim']
const r = document.documentElement.style; ['c1','c2','c3','glow'].forEach(k => r.setProperty('--'+k, th[k]))
document.getElementById('h').innerHTML = 'Seu convite<br>com a <span class="grad">história<br>do seu bebê</span>'
document.getElementById('g1').style.setProperty('--ac', th.a1); document.getElementById('g2').style.setProperty('--ac', th.a2)
document.getElementById('shot').src = th.img
const cx = document.getElementById('bg').getContext('2d'), rnd = (s) => { const x = Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x) }
const g = cx.createLinearGradient(0,0,0,1080); g.addColorStop(0,'#fff'); g.addColorStop(.55,'#f3f3f6'); g.addColorStop(1,'#e6e7ec'); cx.fillStyle = g; cx.fillRect(0,0,1080,1080)
const orb = (x,y,rad,c,a) => { const rg = cx.createRadialGradient(x,y,0,x,y,rad); rg.addColorStop(0,`rgba(${c},${a})`); rg.addColorStop(1,`rgba(${c},0)`); cx.fillStyle = rg; cx.fillRect(x-rad,y-rad,rad*2,rad*2) }
orb(160,200,520,th.pal[1],.12); orb(900,300,520,th.pal[3],.10); orb(200,980,560,th.pal[0],.10); orb(900,950,520,th.pal[4],.10)
cx.strokeStyle = 'rgba(90,90,110,.5)'; cx.lineWidth = 2
for (let i=0;i<9;i++){ const k=i/9, y=800+Math.pow(k,2.1)*280; cx.globalAlpha=.05+k*.2; cx.beginPath(); cx.moveTo(0,y); cx.lineTo(1080,y); cx.stroke() }
cx.globalAlpha=.14; for (let i=-9;i<=9;i++){ cx.beginPath(); cx.moveTo(540+i*36,800); cx.lineTo(540+i*150,1080); cx.stroke() }
cx.globalAlpha=1
for (let i=0;i<36;i++){ cx.fillStyle=`rgba(${th.pal[i%6]},${.12+.2*rnd(i+3)})`; cx.beginPath(); cx.arc(rnd(i)*1080,rnd(i+99)*1080,3+rnd(i+5)*6,0,6.3); cx.fill() }
window.ready = document.fonts.ready.then(() => new Promise(res => { const im = document.getElementById('shot'); im.complete ? res() : im.onload = res }))
</script></body></html>
